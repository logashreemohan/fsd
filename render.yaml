services:
  # 1. Python FastAPI AI Service (Docker runtime packages OpenCV/MediaPipe system dependencies)
  - type: web
    name: morphed-media-ai-service
    runtime: docker
    rootDir: morphed-media-detector/ai-service
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: AI_SERVICE_PORT
        value: 10000

  # 2. Node.js Express Backend
  - type: web
    name: morphed-media-backend
    runtime: node
    rootDir: morphed-media-detector/server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set from MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: morphed-media-ai-service
          property: host

  # 3. React Vite Frontend (Static Site)
  - type: web
    name: morphed-media-frontend
    runtime: static
    rootDir: morphed-media-detector/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to https://<your-backend-service>.onrender.com/api
